# Builds the player build (saved world baked in, dev tools hidden) and serves it on GitHub Pages.
# World snapshot lives in world/*.json (pulled from the game artifact's db collection `world`).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node build.mjs
      - run: node tools/dev-build.mjs
      - run: node tools/share-build.mjs world
      - run: |
          mkdir -p _site
          cp dist/share.html _site/index.html
          cp dist/dev.html _site/dev.html 2>/dev/null || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
