<script type="module">

// body + wheel GLBs instead, for side-by-side comparison.
import * as T from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  for (const z of I.axles) for (const s of [1, -1]) { const w = wheelObj.clone(); w.position.set(wn ? s * I.wx : s * I.wx, wn ? I.wr : I.wr, z); if (s < 0) w.scale.x = -1; car.add(w); }
